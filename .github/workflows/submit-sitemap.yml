name: Submit Sitemap to Search Engines

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Google & Bing of sitemap
        run: |
          SITEMAP="https://je0dev.github.io/personal_garden/sitemap-index.xml"
          curl -s -A "Mozilla/5.0" "https://www.google.com/ping?sitemap=$SITEMAP" || true
          curl -s -A "Mozilla/5.0" "https://www.bing.com/ping?sitemap=$SITEMAP" || true
          echo "Submitted $SITEMAP to search engines"
